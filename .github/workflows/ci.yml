name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-api.txt
          python -m pip install httpx ruff

      - name: Compile check
        run: python -m compileall -q .

      - name: Lint
        run: python -m ruff check .

      - name: Run unit tests
        run: python -m pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sms-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sms-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: student_management_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci_root_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Load schema and seed data into the test database
        env:
          MYSQL_PWD: ci_root_password
        # schema.sql hard-codes "CREATE DATABASE/USE student_management" for
        # local installs; strip those lines so the schema lands in the test DB.
        run: |
          grep -vE '^(CREATE DATABASE|USE )' database/schema.sql | mysql -h 127.0.0.1 -u root student_management_test
          mysql -h 127.0.0.1 -u root student_management_test < database/seed_data.sql

      - name: Run integration tests
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: "3306"
          TEST_DB_USER: root
          TEST_DB_PASSWORD: ci_root_password
          TEST_DB_NAME: student_management_test
        run: python -m pytest tests/test_integration.py -q
