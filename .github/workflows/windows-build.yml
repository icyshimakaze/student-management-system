name: Windows EXE

# Builds the desktop application into a Windows executable on every push
# to main. Download the artifact from the Actions run page.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build executable
        run: pyinstaller StudentManagementSystem.spec --noconfirm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudentManagementSystem-windows
          path: dist/StudentManagementSystem/
          retention-days: 14
